<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Preview Halaman Kuis Wikaru</title>
  <style>
    :root{--navy:#203d7d;--ink:#142344;--muted:#697792;--line:#dbe4f1;--soft:#f5f8fd;--green:#4f805c;--red:#ec3f37}*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif}.wrap{width:min(1540px,calc(100% - 24px));margin:24px auto 48px}h1{margin:0 0 6px;font-size:28px}p{margin:0 0 22px;color:var(--muted)}.devices{display:grid;grid-template-columns:1.7fr .86fr .48fr;gap:24px;align-items:start}.label{margin:0 0 8px;color:#8591a9;font-weight:800;font-size:12px}.device{min-width:0;border:1px solid var(--line);border-radius:24px;background:#fff;box-shadow:0 18px 45px rgba(25,47,91,.08);overflow:hidden}.head{display:grid;grid-template-columns:38px 40px minmax(120px,1fr) minmax(150px,220px) 82px 38px;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line)}button{font:inherit}.square{width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-weight:900}.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--navy);color:#fff;font-size:21px;font-weight:900}.title strong{display:block;font-size:14px}.title small,.voice-head small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.progress strong{font-size:10px}.bar{height:5px;margin-top:6px;border-radius:99px;background:#e5ebf4;overflow:hidden}.bar span{display:block;width:35%;height:100%;background:#5179cb}.timer{display:flex;align-items:center;gap:5px;min-height:36px;padding:5px 9px;border:1px solid #cdd9eb;border-radius:12px;background:#f1f6ff;color:var(--navy);font-size:11px;font-weight:850}.timer svg{width:18px;height:18px}.layout{display:grid;grid-template-columns:2.1fr .78fr;gap:12px;padding:12px 12px 62px}.left{display:grid;grid-template-rows:minmax(430px,1fr) 54px;gap:10px}.card,.panel,.example{border:1px solid var(--line);border-radius:18px;background:#fff}.card{position:relative;display:grid;place-items:center;min-height:430px;overflow:hidden}.mode{position:absolute;right:16px;top:16px;padding:7px 11px;border-radius:999px;background:#eef3ff;color:var(--navy);font-size:10px;font-weight:800}.word{text-align:center}.word .jp{font-size:50px;font-weight:850;letter-spacing:.04em}.word strong{display:block;margin-top:14px;color:#28529b;font-size:23px}.word span{display:block;margin-top:10px;font-size:17px}.seal{position:absolute;left:14px;bottom:12px;width:94px;height:94px;object-fit:contain}.listen{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);min-height:42px;padding:0 18px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--navy);font-weight:800}.example{display:flex;align-items:center;justify-content:center;min-height:54px;color:var(--navy);font-weight:800}.panel{display:flex;flex-direction:column;gap:9px;padding:13px}.voice-head strong{font-size:14px}.voices{display:grid;gap:7px}.voice{display:grid;grid-template-columns:24px 1fr 18px;align-items:center;gap:8px;min-height:50px;padding:7px 9px;border:1px solid var(--line);border-radius:12px;background:#fff}.voice.active{background:var(--navy);color:#fff}.voice svg{width:21px;height:21px}.voice strong{display:block;font-size:11px}.voice small{display:block;font-size:8px;color:inherit;opacity:.76}.status,.mic{padding:11px;border-radius:12px;background:#f6f7f5;color:#667168;font-size:9px}.answers{display:grid;gap:7px}.answers button{min-height:48px;border:0;border-radius:12px;color:#fff;font-weight:850}.correct{background:var(--green)}.wrong{background:var(--red)}.mic{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line)}.switch{width:38px;height:22px;border-radius:99px;background:#d9e1ed}.footer-help{position:absolute;left:20px;bottom:14px;color:var(--navy);font-size:11px;font-weight:800}.device{position:relative}.ipad .head{grid-template-columns:38px 40px 1fr 82px 38px}.ipad .title{display:block}.ipad .progress{grid-column:1/-1}.ipad .layout{display:flex;flex-direction:column;padding-bottom:14px}.ipad .left{grid-template-rows:280px 48px}.ipad .card{min-height:280px}.ipad .word .jp{font-size:39px}.ipad .panel{padding:12px}.ipad .voices{grid-template-columns:1fr 1fr}.ipad .answers{grid-template-columns:1fr 1fr}.ipad .seal{width:80px;height:80px}.ipad .footer-help{display:none}.mobile .head{grid-template-columns:34px 34px 1fr 72px 34px;gap:5px;padding:8px}.mobile .title{display:none}.mobile .progress{grid-column:1/-1}.mobile .layout{display:flex;flex-direction:column;padding:7px 7px 70px;gap:8px}.mobile .left{grid-template-rows:245px 44px}.mobile .card{min-height:245px}.mobile .word .jp{font-size:31px}.mobile .word strong{font-size:16px;margin-top:9px}.mobile .word span{font-size:13px;margin-top:6px}.mobile .seal{width:62px;height:62px;left:6px;bottom:6px}.mobile .listen{min-height:36px;padding:0 12px;font-size:10px;bottom:11px}.mobile .voice:not(.active){display:none}.mobile .answers{position:absolute;left:0;right:0;bottom:0;grid-template-columns:1fr 1fr;padding:8px;background:#fff;border-top:1px solid var(--line)}.mobile .answers button{min-height:48px}.mobile .footer-help{display:none}.mobile .panel{gap:8px}.mobile .voice-head strong{font-size:12px}@media(max-width:1100px){.devices{grid-template-columns:1fr}.device{max-width:820px}.mobile{max-width:390px}}
  </style>
</head>
<body><main class="wrap"><h1>Halaman Kuis Wikaru — produksi final</h1><p>Preview menggunakan sprite ikon dan cutout maskot yang sama dengan aplikasi.</p><div class="devices">
  <section><div class="label">DESKTOP · 1440 PX</div><article class="device desktop"></article></section>
  <section><div class="label">IPAD PORTRAIT · 820 PX</div><article class="device ipad"></article></section>
  <section><div class="label">MOBILE · 390 PX</div><article class="device mobile"></article></section>
</div></main><script>
const icon=id=>`<svg viewBox="0 0 64 64" aria-hidden="true"><use href="../assets/icons/wikaru-kotoba-marks.svg#wk-${id}"></use></svg>`;
const voices=[["hana","Hana Onee-san","Dewasa, lembut, dan keibuan"],["momo","Momo Kawaii","Remaja ceria"],["ren","Ren Ikebo","Remaja tenang"],["kaito","Kaito Dandy","Dewasa dan berwibawa"]];
const template=kind=>`<header class="head"><button class="square">‹</button><span class="mark">あ</span><div class="title"><strong>Kuis Kosakata</strong><small>Pilih jawaban yang paling tepat</small></div><div class="progress"><strong>${kind==="mobile"?"7 / 20":"Kartu 7 dari 20"}</strong><div class="bar"><span></span></div></div><button class="timer">${icon("timer")}00:23</button><button class="square">?</button></header><div class="layout"><section class="left"><div class="card"><span class="mode">● Kana → Arti</span><div class="word"><div class="jp">あたたかい</div><strong>Atatakai</strong><span>Hangat</span></div><img class="seal" src="../assets/generated/seal-guide-clean-v39u1.png?v=20260903-v39u1" alt=""><button class="listen">🔊 Dengar</button></div><div class="example">▢ &nbsp; Contoh Kalimat &nbsp; ›</div></section><aside class="panel"><div class="voice-head"><strong>Pilih suara materi</strong><small>Hana Onee-san · Dewasa, lembut, dan keibuan</small></div><div class="voices">${voices.map((v,i)=>`<div class="voice ${i===0?"active":""}">${icon(v[0])}<span><strong>${v[1]}</strong><small>${v[2]}</small></span>${i===0?"✓":""}</div>`).join("")}</div><div class="status">ⓘ &nbsp; Siap mendengarkan jawabanmu</div><div class="answers"><button class="correct">✓ &nbsp; Benar</button><button class="wrong">⊗ &nbsp; Salah</button></div><div class="mic"><span>🎙️ &nbsp; <strong>Jawab dengan Suara</strong></span><i class="switch"></i></div></aside></div><span class="footer-help">? &nbsp; Petunjuk kuis</span>`;
document.querySelectorAll(".device").forEach(node=>node.innerHTML=template(node.classList.contains("mobile")?"mobile":node.classList.contains("ipad")?"ipad":"desktop"));
</script></body></html>
