    <text x="83" y="34" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#284989" text-anchor="middle">3.653 materi</text>
    <rect x="180" width="182" height="52" rx="26" fill="#ECF8F2"/>
    <text x="271" y="34" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#347450" text-anchor="middle">50 bab lengkap</text>
  </g>
  <rect x="696" y="100" width="390" height="430" rx="44" fill="url(#panel)"/>
  <circle cx="986" cy="200" r="62" fill="#FFD86F"/>
  <rect x="780" y="226" width="180" height="44" rx="22" fill="#fff" opacity=".9"/>
  <circle cx="822" cy="220" r="38" fill="#fff" opacity=".9"/>
  <circle cx="880" cy="222" r="30" fill="#fff" opacity=".9"/>
  <rect x="752" y="328" width="112" height="112" rx="32" fill="#fff" opacity=".15"/>
  <text x="808" y="403" font-family="Arial, sans-serif" font-size="66" font-weight="800" fill="#fff" text-anchor="middle">A</text>
  <rect x="902" y="364" width="100" height="100" rx="30" fill="#F5BC9A" opacity=".24"/>
  <text x="952" y="433" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#fff" text-anchor="middle">JP</text>
  <text x="890" y="498" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#DDE7FA" text-anchor="middle">Sedikit belajar setiap hari.</text>
