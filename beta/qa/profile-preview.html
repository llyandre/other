<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Preview Avatar dan Julukan Wikaru</title>
  <style>
    :root{font-family:"Plus Jakarta Sans",Inter,system-ui,sans-serif;color:#172033;background:#f6f7fb}
    *{box-sizing:border-box}body{margin:0;padding:42px 24px 56px;background:radial-gradient(circle at 12% 8%,#fff4dd,transparent 28%),radial-gradient(circle at 90% 10%,#eaf2ff,transparent 30%),#f6f7fb}
    main{max-width:1180px;margin:auto}.head{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:28px}.head p{margin:7px 0 0;color:#687386}.badge{padding:9px 13px;border-radius:999px;background:#e9edfa;color:#243b73;font-weight:800;font-size:12px}h1{margin:0;font-size:clamp(28px,4vw,46px)}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{display:grid;grid-template-columns:74px minmax(0,1fr);gap:14px;align-items:center;min-height:108px;padding:16px;border:1px solid #e1e6f0;border-radius:22px;background:rgba(255,255,255,.92);box-shadow:0 12px 30px rgba(36,59,115,.07)}.card img{width:70px;height:70px;margin:2px;object-fit:contain;border-radius:50%}.card strong{display:block;font-size:15px}.card span{display:block;margin-top:5px;color:#687386;font-size:12px;line-height:1.35}.card.admin{border-color:#d8b45f;background:linear-gradient(145deg,#fffdf6,#f1f4ff);box-shadow:0 16px 36px rgba(36,59,115,.13)}.card.admin strong{color:#9a6719}.card.default{background:#f4f6fc}.admin-tag{display:inline-flex!important;width:max-content;margin-top:8px!important;padding:4px 7px;border-radius:999px;background:#243b73;color:#fff!important;font-size:9px!important;font-weight:800;letter-spacing:.08em}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){body{padding:26px 16px}.head{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}.card{min-height:96px}}
  </style>
</head>
<body>
  <main>
    <div class="head"><div><h1>Avatar & julukan Wikaru</h1><p>Sebelum nama diisi memakai akun default; nama yang sama selalu mendapat avatar yang sama.</p></div><span class="badge">1 default + 30 pengguna + 1 admin</span></div>
    <section class="grid" id="profileGrid" aria-label="Daftar avatar dan julukan"></section>
  </main>
  <script type="module">
    import{USER_PROFILES,ADMIN_PROFILE,DEFAULT_PROFILE}from"../assets/js/profile-assets.js";
    const list=[DEFAULT_PROFILE,...USER_PROFILES,ADMIN_PROFILE];
    document.querySelector("#profileGrid").innerHTML=list.map(profile=>`<article class="card ${profile.admin?"admin":""} ${profile.default?"default":""}"><img src="../assets/profile/${profile.file}" alt="Avatar ${profile.nicknameId}"><div><strong>${profile.nicknameId}</strong><span>${profile.nicknameJa}</span>${profile.admin?'<span class="admin-tag">ADMIN KHUSUS</span>':profile.default?'<span class="admin-tag">AKUN DEFAULT</span>':""}</div></article>`).join("");
  </script>
</body>
</html>
